name: Release Artifacts

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-artifacts:
    name: Verify And Build Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    outputs:
      artifact_name: ${{ steps.evidence.outputs.release_artifact_name }}
      bundle_name: ${{ steps.evidence.outputs.bundle_name }}
      evidence_artifact_name: ${{ steps.evidence.outputs.artifact_name }}
      manifest_path: ${{ steps.evidence.outputs.manifest }}
      package_version: ${{ steps.evidence.outputs.package_version }}
      prerelease: ${{ steps.evidence.outputs.prerelease }}
      release_tag: ${{ steps.evidence.outputs.release_tag }}
      sdist_name: ${{ steps.distributions.outputs.sdist_name }}
      tag_commit: ${{ steps.provenance.outputs.tag_commit }}
      wheel_name: ${{ steps.distributions.outputs.wheel_name }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch governed branches
        run: >
          git fetch origin
          +refs/heads/main:refs/remotes/origin/main
          +refs/heads/production:refs/remotes/origin/production
          --tags

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Resolve tag provenance
        id: provenance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          from scripts.validate_release_tag import parse_release_tag

          release_tag = os.environ["RELEASE_TAG"]
          parsed_tag = parse_release_tag(release_tag)
          with Path("pyproject.toml").open("rb") as stream:
              package_version = tomllib.load(stream)["project"]["version"]
          if package_version != parsed_tag.package_version:
              raise SystemExit("release tag and package version do not match")

          tag_commit = subprocess.run(
              ["git", "rev-list", "-n", "1", release_tag],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          branch_commit = subprocess.run(
              ["git", "rev-parse", f"origin/{parsed_tag.branch}"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          for name, value in (
              ("tag_commit", tag_commit),
              ("branch_commit", branch_commit),
          ):
              if re.fullmatch(r"[0-9a-f]{40}", value) is None:
                  raise SystemExit(f"invalid {name}")

          output_lines = (
              f"branch={parsed_tag.branch}\n"
              f"tag_commit={tag_commit}\n"
              f"branch_commit={branch_commit}\n"
              f"package_version={parsed_tag.package_version}\n"
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(output_lines)
          PY

      - name: Validate tag provenance
        env:
          BRANCH_COMMIT: ${{ steps.provenance.outputs.branch_commit }}
          PACKAGE_VERSION: ${{ steps.provenance.outputs.package_version }}
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_COMMIT: ${{ steps.provenance.outputs.tag_commit }}
        run: >
          python scripts/validate_release_tag.py
          --tag "${RELEASE_TAG}"
          --package-version "${PACKAGE_VERSION}"
          --tag-commit "${TAG_COMMIT}"
          --branch-commit "${BRANCH_COMMIT}"

      - name: Resolve selected release evidence
        id: evidence
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from scripts.release_evidence.models import load_release_evidence_manifest
          from scripts.validate_release_tag import parse_release_tag

          release_tag = os.environ["RELEASE_TAG"]
          parsed_tag = parse_release_tag(release_tag)
          validated_version = parsed_tag.package_version
          manifest_path = Path("quality-evidence", "releases", validated_version,
                               "evidence-manifest.json")
          manifest = load_release_evidence_manifest(manifest_path)
          expected_artifact_name = f"graph-rag-c9-{validated_version}-quality-evidence"
          expected_bundle_name = f"{expected_artifact_name}.zip"
          if manifest.release.package_version != validated_version:
              raise SystemExit("manifest package version does not match release tag")
          if manifest.release.tag != release_tag:
              raise SystemExit("manifest tag does not match release tag")
          if manifest.provenance.repository != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("manifest repository does not match workflow repository")
          if manifest.transport.artifact_name != expected_artifact_name:
              raise SystemExit("manifest artifact name is not release-derived")
          if manifest.bundle.name != expected_bundle_name:
              raise SystemExit("manifest bundle name is not release-derived")

          release_artifact_name = f"graph-rag-c9-{validated_version}-release-assets"
          output_lines = (
              f"manifest={manifest_path.as_posix()}\n"
              f"artifact_id={manifest.transport.artifact_id}\n"
              f"run_id={manifest.transport.workflow_run_id}\n"
              f"artifact_name={expected_artifact_name}\n"
              f"bundle_name={expected_bundle_name}\n"
              f"package_version={validated_version}\n"
              f"release_tag={parsed_tag.tag}\n"
              f"prerelease={str(parsed_tag.prerelease).lower()}\n"
              f"release_artifact_name={release_artifact_name}\n"
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(output_lines)
          PY

      - name: Query selected evidence artifact
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact_id }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api
          "repos/${GH_REPO}/actions/artifacts/${ARTIFACT_ID}"
          > "artifact-metadata.json"

      - name: Download selected evidence artifact
        env:
          ARTIFACT_NAME: ${{ steps.evidence.outputs.artifact_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.evidence.outputs.run_id }}
        run: >
          gh run download "${RUN_ID}"
          --repo "${GH_REPO}"
          --name "${ARTIFACT_NAME}"
          --dir "downloaded-evidence"

      - name: Verify selected release evidence
        env:
          EVIDENCE_BUNDLE: downloaded-evidence/${{ steps.evidence.outputs.bundle_name }}
          EVIDENCE_MANIFEST: ${{ steps.evidence.outputs.manifest }}
          RELEASE_COMMIT: ${{ steps.provenance.outputs.tag_commit }}
          RELEASE_TAG: ${{ steps.evidence.outputs.release_tag }}
        run: >
          python -m scripts.release_evidence verify
          --repository-root .
          --manifest "${EVIDENCE_MANIFEST}"
          --release-commit "${RELEASE_COMMIT}"
          --tag "${RELEASE_TAG}"
          --bundle "${EVIDENCE_BUNDLE}"
          --artifact-metadata "artifact-metadata.json"
          --json

      - name: Build wheel and sdist
        run: python -m build --sdist --wheel --outdir dist

      - name: Verify distribution metadata
        env:
          PACKAGE_VERSION: ${{ steps.evidence.outputs.package_version }}
        run: >
          python scripts/verify_distribution_metadata.py
          --directory dist
          --expected-version "${PACKAGE_VERSION}"

      - name: Resolve distribution asset names
        id: distributions
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          def one_file(pattern: str) -> Path:
              matches = sorted(Path("dist").glob(pattern))
              if len(matches) != 1:
                  raise SystemExit(f"expected one distribution matching {pattern}")
              if re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.+-]*", matches[0].name) is None:
                  raise SystemExit("unsafe distribution filename")
              return matches[0]

          wheel = one_file("*.whl")
          sdist = one_file("*.tar.gz")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"wheel_name={wheel.name}\nsdist_name={sdist.name}\n")
          PY

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload verified release payload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.evidence.outputs.release_artifact_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            sbom.cdx.json
            ${{ steps.evidence.outputs.manifest }}
            downloaded-evidence/${{ steps.evidence.outputs.bundle_name }}
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  publish-draft:
    name: Publish Draft GitHub Release
    needs: release-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Validate publication identity
        env:
          BUNDLE_NAME: ${{ needs.release-artifacts.outputs.bundle_name }}
          EVENT_TAG: ${{ github.ref_name }}
          EVIDENCE_ARTIFACT_NAME: ${{ needs.release-artifacts.outputs.evidence_artifact_name }}
          MANIFEST_PATH: ${{ needs.release-artifacts.outputs.manifest_path }}
          PACKAGE_VERSION: ${{ needs.release-artifacts.outputs.package_version }}
          PAYLOAD_ARTIFACT_NAME: ${{ needs.release-artifacts.outputs.artifact_name }}
          PRERELEASE: ${{ needs.release-artifacts.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.release-artifacts.outputs.release_tag }}
          TAG_COMMIT: ${{ needs.release-artifacts.outputs.tag_commit }}
        run: |
          test "${EVENT_TAG}" = "${RELEASE_TAG}"
          if [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            expected_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            expected_prerelease=false
          elif [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.([1-9][0-9]*)$ ]]; then
            expected_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}rc${BASH_REMATCH[4]}"
            expected_prerelease=true
          else
            echo "Invalid release tag identity." >&2
            exit 1
          fi
          test "${PACKAGE_VERSION}" = "${expected_version}"
          test "${PRERELEASE}" = "${expected_prerelease}"
          test "${EVIDENCE_ARTIFACT_NAME}" = "graph-rag-c9-${expected_version}-quality-evidence"
          test "${BUNDLE_NAME}" = "${EVIDENCE_ARTIFACT_NAME}.zip"
          test "${PAYLOAD_ARTIFACT_NAME}" = "graph-rag-c9-${expected_version}-release-assets"
          test "${MANIFEST_PATH}" = "quality-evidence/releases/${expected_version}/evidence-manifest.json"
          [[ "${TAG_COMMIT}" =~ ^[0-9a-f]{40}$ ]]

      - name: Download current run release payload
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_NAME: ${{ needs.release-artifacts.outputs.artifact_name }}
        run: >
          gh run download "${CURRENT_RUN_ID}"
          --repo "${GH_REPO}"
          --name "${RELEASE_ARTIFACT_NAME}"
          --dir "release-payload"

      - name: Validate remote tag commit
        env:
          EXPECTED_TAG_COMMIT: ${{ needs.release-artifacts.outputs.tag_commit }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-artifacts.outputs.release_tag }}
        run: |
          remote_tag_commit="$(
            gh api "repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq '.sha'
          )"
          [[ "${remote_tag_commit}" =~ ^[0-9a-f]{40}$ ]]
          test "${remote_tag_commit}" = "${EXPECTED_TAG_COMMIT}"

      - name: Create or update draft GitHub Release
        env:
          BUNDLE_NAME: ${{ needs.release-artifacts.outputs.bundle_name }}
          EVENT_TAG: ${{ github.ref_name }}
          EVIDENCE_ARTIFACT_NAME: ${{ needs.release-artifacts.outputs.evidence_artifact_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_PATH: ${{ needs.release-artifacts.outputs.manifest_path }}
          PACKAGE_VERSION: ${{ needs.release-artifacts.outputs.package_version }}
          PAYLOAD_ARTIFACT_NAME: ${{ needs.release-artifacts.outputs.artifact_name }}
          PRERELEASE: ${{ needs.release-artifacts.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.release-artifacts.outputs.release_tag }}
          SDIST_NAME: ${{ needs.release-artifacts.outputs.sdist_name }}
          TAG_COMMIT: ${{ needs.release-artifacts.outputs.tag_commit }}
          WHEEL_NAME: ${{ needs.release-artifacts.outputs.wheel_name }}
        run: |
          test "${EVENT_TAG}" = "${RELEASE_TAG}"
          if [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            expected_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            expected_prerelease=false
          elif [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.([1-9][0-9]*)$ ]]; then
            expected_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}rc${BASH_REMATCH[4]}"
            expected_prerelease=true
          else
            echo "Invalid release tag identity." >&2
            exit 1
          fi
          test "${PACKAGE_VERSION}" = "${expected_version}"
          test "${PRERELEASE}" = "${expected_prerelease}"
          test "${EVIDENCE_ARTIFACT_NAME}" = "graph-rag-c9-${expected_version}-quality-evidence"
          test "${BUNDLE_NAME}" = "${EVIDENCE_ARTIFACT_NAME}.zip"
          test "${PAYLOAD_ARTIFACT_NAME}" = "graph-rag-c9-${expected_version}-release-assets"
          test "${MANIFEST_PATH}" = "quality-evidence/releases/${expected_version}/evidence-manifest.json"

          shopt -s nullglob
          wheels=(release-payload/dist/*.whl)
          sdists=(release-payload/dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          test "$(basename "${wheels[0]}")" = "${WHEEL_NAME}"
          test "$(basename "${sdists[0]}")" = "${SDIST_NAME}"
          assets=(
            "release-payload/dist/${WHEEL_NAME}"
            "release-payload/dist/${SDIST_NAME}"
            "release-payload/sbom.cdx.json"
            "release-payload/${MANIFEST_PATH}"
            "release-payload/downloaded-evidence/${BUNDLE_NAME}"
          )
          for asset in "${assets[@]}"; do
            test -f "${asset}"
            test ! -L "${asset}"
          done
          test "${#assets[@]}" -eq 5

          expected_names=()
          for asset in "${assets[@]}"; do
            asset_name="$(basename "${asset}")"
            for expected_name in "${expected_names[@]}"; do
              test "${asset_name}" != "${expected_name}"
            done
            expected_names+=("${asset_name}")
          done
          test "${#expected_names[@]}" -eq 5

          gh api --paginate "repos/${GH_REPO}/releases?per_page=100" --slurp \
            > "existing-releases.json"
          jq --arg tag "${RELEASE_TAG}" \
            '[.[][] | select(.tag_name == $tag)]' \
            "existing-releases.json" > "selected-releases.json"
          release_count="$(jq 'length' "selected-releases.json")"
          test "${release_count}" -le 1
          if [[ "${release_count}" == "1" ]]; then
            is_draft="$(jq -r '.[0].draft' "selected-releases.json")"
            is_prerelease="$(jq -r '.[0].prerelease' "selected-releases.json")"
            existing_tag="$(jq -r '.[0].tag_name' "selected-releases.json")"
            test "${is_draft}" = "true"
            test "${is_prerelease}" = "${PRERELEASE}"
            test "${existing_tag}" = "${RELEASE_TAG}"
            mapfile -t existing_assets < <(
              jq -r '.[0].assets[].name' "selected-releases.json"
            )
            for asset_name in "${existing_assets[@]}"; do
              matched=false
              for expected_name in "${expected_names[@]}"; do
                if [[ "${asset_name}" == "${expected_name}" ]]; then
                  matched=true
                  break
                fi
              done
              test "${matched}" = "true"
            done
            release_exists=true
          else
            release_exists=false
          fi

          remote_tag_commit="$(
            gh api "repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq '.sha'
          )"
          [[ "${remote_tag_commit}" =~ ^[0-9a-f]{40}$ ]]
          test "${remote_tag_commit}" = "${TAG_COMMIT}"
          if [[ "${release_exists}" == "true" ]]; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" \
              --repo "${GH_REPO}" --clobber
          else
            release_args=(
              --draft
              --verify-tag
              --title "${RELEASE_TAG}"
              --notes "Draft release assets generated from verified repository evidence."
            )
            if [[ "${PRERELEASE}" == "true" ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --repo "${GH_REPO}" "${release_args[@]}"
          fi

          gh api "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" \
            > "published-release.json"
          final_draft="$(jq -r '.draft' "published-release.json")"
          final_prerelease="$(jq -r '.prerelease' "published-release.json")"
          final_tag="$(jq -r '.tag_name' "published-release.json")"
          test "${final_draft}" = "true"
          test "${final_prerelease}" = "${PRERELEASE}"
          test "${final_tag}" = "${RELEASE_TAG}"
          mapfile -t final_assets < <(jq -r '.assets[].name' "published-release.json")
          test "${#final_assets[@]}" -eq 5
          for asset_name in "${final_assets[@]}"; do
            matched=false
            for expected_name in "${expected_names[@]}"; do
              if [[ "${asset_name}" == "${expected_name}" ]]; then
                matched=true
                break
              fi
            done
            test "${matched}" = "true"
          done
          for expected_name in "${expected_names[@]}"; do
            match_count=0
            for asset_name in "${final_assets[@]}"; do
              if [[ "${asset_name}" == "${expected_name}" ]]; then
                ((match_count += 1))
              fi
            done
            test "${match_count}" -eq 1
          done
