name: CI

on:
  pull_request:
    branches:
      - development
      - production
      - main
  push:
    branches:
      - development
      - production
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-flow-policy:
    name: Branch Flow Policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate branch flow
        run: >
          python scripts/check_branch_flow.py
          --base "${{ github.base_ref }}"
          --head "${{ github.head_ref }}"
          --mode enforce

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy --config-file pyproject.toml

      - name: Pytest with coverage baseline
        run: >
          python -m pytest -q
          --cov=rag_modules
          --cov=scripts
          --cov-branch
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-report=xml

      - name: Package branch coverage
        run: python scripts/check_branch_coverage.py

      - name: Incremental coverage
        if: github.event_name == 'pull_request'
        run: >
          diff-cover coverage.xml
          --compare-branch=origin/${{ github.base_ref }}
          --fail-under=80

      - name: Offline release gate
        run: python scripts/release_gate.py

      - name: Dependency vulnerability scan
        run: >
          python -m pip_audit
          -r requirements.txt
          -r requirements-dev.txt
          --strict
          --progress-spinner off

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: graph-rag-c9-sbom
          path: sbom.cdx.json
